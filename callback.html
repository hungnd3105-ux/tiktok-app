<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connected – HUNG ND Content Tool</title>
<style>
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:760px;margin:60px auto;padding:0 16px;line-height:1.6;color:#222}
a{color:#0a66c2}
.box{background:#f5f5f5;border-radius:10px;padding:20px;margin:24px 0}
textarea{width:100%;box-sizing:border-box;font-family:Menlo,monospace;font-size:14px;padding:12px;border:1px solid #ccc;border-radius:8px;height:90px}
.btn{background:#111;color:#fff;border:0;border-radius:8px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px}
.ok{color:#0a7d33}.err{color:#c62828}
</style>
</head>
<body>
<h1>HUNG ND Content Tool</h1>
<div id="out" class="box">Loading…</div>
<p><a href="./">Back to home</a></p>

<script>
const p = new URLSearchParams(window.location.search);
const out = document.getElementById("out");
const code = p.get("code");
const err = p.get("error");
let saved = null;
try { saved = sessionStorage.getItem("tt_state"); } catch (e) {}

if (err) {
  out.innerHTML = '<p class="err"><strong>Connection failed:</strong> ' +
    (p.get("error_description") || err).replace(/</g, "&lt;") + '</p>';
} else if (!code) {
  out.innerHTML = '<p class="err">No authorization code found. Please start again from the home page.</p>';
} else {
  const stateWarn = (saved && p.get("state") !== saved)
    ? '<p class="err">Warning: state mismatch. If you did not just click "Login with TikTok", close this page.</p>' : '';
  out.innerHTML =
    '<p class="ok"><strong>Your TikTok account is connected.</strong></p>' + stateWarn +
    '<p>Scopes granted: <code>' + (p.get("scopes") || "").replace(/</g, "&lt;") + '</code></p>' +
    '<p>Copy the code below into the HUNG ND Content Tool app to finish setup (it expires in a few minutes):</p>' +
    '<textarea id="code" readonly></textarea>' +
    '<button class="btn" id="copy">Copy code</button>';
  document.getElementById("code").value = code;
  document.getElementById("copy").onclick = function () {
    const t = document.getElementById("code"); t.select();
    try { navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand("copy"); }
    this.textContent = "Copied ✓";
  };
}
</script>
</body>
</html>
